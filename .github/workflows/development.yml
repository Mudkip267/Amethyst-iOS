name: Development build

on:
  pull_request:
    branches-ignore:
      - 'l10n_main'
    types: [opened, reopened]
  push:
    branches-ignore:
      - 'l10n_main'
  workflow_dispatch:

jobs:
  build:
    name: Development build
    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios
    
    runs-on: ${{ github.ref_name == 'codex/amethyst-horizon-runtime' && 'macos-26' || 'macos-latest' }}
    steps:
      - name: Remove work folders
        run: |
          echo "before"
          ls -lah ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          echo "after"
          ls -lah ./
          
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Checkout repository submodules
        env:
          GIT_LFS_SKIP_SMUDGE: 1
        run: |
          git lfs install --skip-smudge
          git config --global filter.lfs.smudge "git-lfs smudge --skip -- %f"
          git config --global filter.lfs.process "git-lfs filter-process --skip"

          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Setup Xcode Version
        uses: maxim-lobanov/setup-xcode@master
        with:
          xcode-version: 'latest-stable'

      - name: Install Dependencies
        if: github.ref_name != 'codex/amethyst-horizon-runtime'
        run: brew install make ldid temurin@8

      - name: Install iOS build dependencies
        if: github.ref_name == 'codex/amethyst-horizon-runtime'
        run: brew install make ldid

      - name: Install the JDK 8 boot compiler
        if: github.ref_name == 'codex/amethyst-horizon-runtime'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Set the Amethyst boot compiler path
        if: github.ref_name == 'codex/amethyst-horizon-runtime'
        run: echo "BOOTJDK=$JAVA_HOME/bin" >> "$GITHUB_ENV"

      - name: Checkout pinned Horizon iOS source
        if: github.ref_name == 'codex/amethyst-horizon-runtime'
        uses: actions/checkout@v4
        with:
          repository: heyskylo/horizon-ios
          ref: cf2707b035917d9f93fb7ea89ddc077396e19e96
          path: horizon-engine-src
          persist-credentials: false

      - name: Prepare bundled iOS Java runtimes
        if: github.ref_name == 'codex/amethyst-horizon-runtime'
        run: |
          source_ipa="$RUNNER_TEMP/amethyst-runtime-source.ipa"
          source_root="$RUNNER_TEMP/amethyst-runtime-source"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            --output "$source_ipa" \
            https://github.com/Taylen27/Amethyst-iOS/releases/download/1.2.0/Amethyst-1.2.0.ipa
          echo "c9f413f24266d010a81c3a51df44464944aeba4268581ee40592c920371e9d33  $source_ipa" | shasum -a 256 -c
          ditto -x -k "$source_ipa" "$source_root"
          mkdir -p depends
          for version in 8 17 21 25; do
            name="java-$version-openjdk"
            runtime="$source_root/Payload/AngelAuraAmethyst.app/java_runtimes/$name"
            test -s "$runtime/release"
            test -s "$runtime/lib/server/libjvm.dylib"
            ditto "$runtime" "depends/$name"
          done

      - name: Install Horizon Rust toolchain
        if: github.ref_name == 'codex/amethyst-horizon-runtime'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Horizon Rust build
        if: github.ref_name == 'codex/amethyst-horizon-runtime'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: horizon-engine-src -> target
          cache-on-failure: true

      - name: Build Horizon Rust engine and launcher framework
        if: github.ref_name == 'codex/amethyst-horizon-runtime'
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          bash tools/build-horizon-ios.sh horizon-engine-src "$RUNNER_TEMP/HorizonFrameworks"
          echo "HORIZON_FRAMEWORKS_DIR=$RUNNER_TEMP/HorizonFrameworks" >> "$GITHUB_ENV"

      - name: Get gl4es latest commit hash
        id: gl4es-sha
        run: echo "::set-output name=sha::$(echo $(git ls-remote https://github.com/PojavLauncherTeam/gl4es-114-extra refs/heads/master | grep -io '^\S*'))"
        shell: bash

      - name: Cache gl4es
        uses: actions/cache@main
        if: false # use gl4es 1.1.5
        id: gl4es-cache
        with:
          path: gl4es/libs
          key: gl4es-holy-ios-shared-2-${{ steps.gl4es-sha.outputs.sha }}

      - name: Get gl4es
        if: false && steps.gl4es-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@main
        with:
          repository: 'PojavLauncherTeam/gl4es-114-extra'
          path: 'gl4es'

      - name: Build gl4es
        if: false && steps.gl4es-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          cd gl4es
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"
          export PATH=/opt/procursus/bin:$PATH
          wget https://github.com/leetal/ios-cmake/raw/master/ios.toolchain.cmake
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake -DDEFAULT_ES=2 \
            -DNOX11=ON -DNOEGL=OFF -DSTATICLIB=OFF -DPLATFORM=OS64 \
            -DCMAKE_C_FLAGS=-Wno-error=implicit-function-declaration
          cmake --build build --config RelWithDebInfo --target GL
          cp -R lib/libGL.dylib ../Natives/resources/Frameworks/libgl4es_114.dylib
          
      - name: Push gl4es
        if: false && github.event != 'pull_request' && github.ref_name == 'main' && steps.gl4es-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          git add Natives/resources/Frameworks/libgl4es_114.dylib
          git commit -am "CI: Update gl4es"
          git push

      - name: Build for ${{ matrix.platform_name }}
        run: |
          export PATH=/opt/homebrew/bin:$PATH
          export SLIMMED=1
          if [ -n "${HORIZON_FRAMEWORKS_DIR:-}" ]; then
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} SLIMMED=0 SLIMMED_ONLY=0
            python3 - <<'PY'
          import plistlib
          from pathlib import Path
          from zipfile import ZipFile

          ipa, = Path("artifacts").glob("org.angelauramc.amethyst-*-ios.ipa")
          with ZipFile(ipa) as archive:
              root = "Payload/AngelAuraAmethyst.app/"
              info = plistlib.loads(archive.read(root + "Info.plist"))
              if info["CFBundleIdentifier"] != "org.angelauramc.amethyst":
                  raise SystemExit("Unexpected Amethyst bundle identifier")
              members = ["AngelAuraAmethyst", "Frameworks/libAmethystHorizon.dylib",
                         "Frameworks/HorizonLauncherKit.framework/HorizonLauncherKit"]
              for version in (8, 17, 21, 25):
                  runtime = f"java_runtimes/java-{version}-openjdk/"
                  members.extend((runtime + "release", runtime + "lib/server/libjvm.dylib"))
              for member in members:
                  if archive.getinfo(root + member).file_size == 0:
                      raise SystemExit(f"Empty IPA entry: {member}")
              if bad_entry := archive.testzip():
                  raise SystemExit(f"Corrupted IPA entry: {bad_entry}")
              print(f"Verified {ipa.name}: Amethyst, Horizon, and Java 8/17/21/25")
          PY
          elif [ "${{ matrix.platform_name }}" == "ios" ]; then
            # Build ipa and tipa for iOS
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }}
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1
          elif [ "${{ matrix.platform_name }}" == "tvos" ]; then
            # Build tipa only for tvOS
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1
          else
            # Build ipa only for everything else
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }}
          fi

      - name: Upload regular ipa
        uses: actions/upload-artifact@main
        with:
          name: org.angelauramc.amethyst-${{ matrix.platform_name }}.ipa
          path: artifacts/org.angelauramc.amethyst-*-${{ matrix.platform_name }}.ipa

      - name: Upload regular tipa
        uses: actions/upload-artifact@main
        with:
          name: org.angelauramc.amethyst-${{ matrix.platform_name }}-trollstore.tipa
          path: artifacts/org.angelauramc.amethyst-*-${{ matrix.platform_name }}-trollstore.tipa

      - name: Upload slimmed ipa
        uses: actions/upload-artifact@main
        with:
          name: org.angelauramc.amethyst.slimmed-${{ matrix.platform_name }}.ipa
          path: artifacts/org.angelauramc.amethyst.slimmed-*-${{ matrix.platform_name }}.ipa

      - name: Upload slimmed tipa
        uses: actions/upload-artifact@main
        with:
          name: org.angelauramc.amethyst.slimmed-${{ matrix.platform_name }}-trollstore.tipa
          path: artifacts/org.angelauramc.amethyst.slimmed-*-${{ matrix.platform_name }}-trollstore.tipa

      - name: Upload PojavLauncher.dSYM
        uses: actions/upload-artifact@main
        if: matrix.platform_name == 'ios'
        with:
          name: AngelAuraAmethyst.dSYM
          path: artifacts/AngelAuraAmethyst.dSYM
